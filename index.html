<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>404 not found</title>
<style>
:root{--bg:#0c0c0b;--fg:#d9d6cc;--dim:#5f5d57;--duck:#e6b93c}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg)}
body{margin:0 auto;max-width:760px;min-height:100vh;padding:12vh 16px 16px;font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[hidden]{display:none!important}
h1{margin:0 0 .15em;font-weight:400;line-height:.9;letter-spacing:-.04em;font-size:min(42vh,calc(min(92vw,728px) / (var(--n,1) * .6)))}
h1 b{font-weight:inherit;color:var(--duck)}
h1.done{color:var(--duck)}
.big{margin:0;font-size:clamp(4rem,18vw,9rem);line-height:1;color:var(--dim)}
.dim{color:var(--dim)}
a{color:inherit}
pre{overflow-x:auto}
#f{margin-top:2.5em}
#f:not(.s0)::before{content:"> ";color:var(--dim)}
input{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--dim);outline:0;padding:.2em 0;width:min(90%,34ch);caret-color:var(--duck);border-radius:0}
input:focus{border-color:var(--fg)}
.s0 input{font-size:clamp(1rem,5.8vw,1.6rem);letter-spacing:.5ch;width:23ch;border:0;background:repeating-linear-gradient(90deg,var(--dim) 0 1ch,transparent 1ch 1.5ch) 0 100%/22.5ch 2px no-repeat}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#msg{min-height:1.6em;margin:.6em 0 0}
#hints p{margin:.3em 0}
</style>
<script src="/app.js" defer></script>
</head>
<body>
<h1 id="letters" hidden></h1>
<p id="release-notes" hidden>release notes: enhanced bitcoin mining capabilities, improved credential harvesting routines, added sophisticated anti-malware evasion... you remember?</p>
<div id="stage"></div>
<form id="f" autocomplete="off"><input id="a" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="answer"></form>
<p id="msg" class="dim"></p>
<div id="hints" class="dim"></div>
</body>
</html>
